name: Seguimiento TechMarleys

# Cómo se mantiene el horario (hora de Panamá, UTC-5):
# GitHub no respeta bien el horario "schedule" (lo atrasa horas o lo salta), así
# que solo se usa para arrancar. Cada revisión termina esperando hasta la
# siguiente hora a los :07 y lanza ella misma la siguiente revisión, en cadena,
# de 10 am a 8 pm. Si la cadena se cortara, el siguiente "schedule" la reinicia.

on:
  schedule:
    - cron: "17 12-23 * * *"   # 7 am a 6 pm
    - cron: "17 0,1 * * *"     # 7 pm y 8 pm
  workflow_dispatch:
    inputs:
      encadenada:
        description: "La lanzó la revisión anterior (respeta el horario)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: seguimiento
  cancel-in-progress: false

env:
  TZ: America/Panama

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Revisar la tienda
        run: python nube.py ${{ (github.event_name == 'schedule' || inputs.encadenada) && '--programado' || '' }}

      - name: Guardar el historial
        run: |
          git config user.name "seguimiento-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add datos/
          git diff --cached --quiet || git commit -m "Captura $(date '+%Y-%m-%d %H:%M')"
          git pull --rebase -q
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: sitio

      - id: publicar
        uses: actions/deploy-pages@v4

  siguiente:
    needs: capturar
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v5

      - name: Esperar y lanzar la siguiente revisión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          espera=$(python3 proxima.py)
          if [ "$espera" -lt 0 ]; then
            echo "No hay más revisiones por hoy; mañana arranca con el horario de GitHub."
            exit 0
          fi
          echo "Siguiente revisión en $((espera / 60)) minutos"
          sleep "$espera"
          for intento in 1 2 3; do
            gh workflow run seguimiento.yml --ref main -f encadenada=true && exit 0
            sleep 30
          done
          exit 1
